name: Android release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing keystore secret}" "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password}" "${ANDROID_KEY_ALIAS:?Missing key alias}" "${ANDROID_KEY_PASSWORD:?Missing key password}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease
      - name: Read APK version
        id: version
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import re

          with open("app/build/outputs/apk/release/output-metadata.json") as f:
              element = json.load(f)["elements"][0]
          version = element["versionName"]
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)*(?:[+-][0-9A-Za-z.-]+)?", version):
              raise ValueError("Invalid version name for release tag")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"name={version}\n")
          PYCODE
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          existing_tag=$(git ls-remote --tags origin "refs/tags/v${VERSION_NAME}")
          if [[ -n "$existing_tag" ]]; then
            echo "Tag v${VERSION_NAME} already exists; skipping release. Update the version to publish a new release."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/PocketUpwatch-${VERSION_NAME}.apk"
          gh release create "v${VERSION_NAME}" "app/build/outputs/apk/release/PocketUpwatch-${VERSION_NAME}.apk" \
            --target "$RELEASE_COMMIT" --title "v${VERSION_NAME}" --generate-notes
